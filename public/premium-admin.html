<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduFriends Premium | Administración</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#18243b}main{max-width:1100px;margin:auto;padding:30px}.box{background:#fff;border:1px solid #dde5f0;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 10px 30px #19345b10}input,button{padding:11px 13px;border-radius:10px;border:1px solid #cad5e4;font:inherit}button{cursor:pointer;border:0;background:#1769ff;color:#fff;font-weight:800}.danger{background:#d93434}.approve{background:#1b9d58}.order{display:grid;grid-template-columns:260px 1fr auto;gap:18px;align-items:start;border-top:1px solid #edf1f6;padding-top:18px;margin-top:18px}.proof{width:100%;max-height:320px;object-fit:contain;background:#f6f8fb;border-radius:12px}.meta{line-height:1.6}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff5d8;color:#775c00;font-size:.8rem;font-weight:800}.ok{background:#e7fff0;color:#126b3a}.bad{background:#ffeaea;color:#9c2525}@media(max-width:800px){.order{grid-template-columns:1fr}.proof{max-height:420px}}</style></head><body><main><div class="box"><h1>🛠️ EduFriends Premium</h1><p>Panel privado para verificar pagos de S/3.</p><input id="key" type="password" placeholder="ADMIN_KEY" style="width:70%"><button onclick="loadOrders()">Cargar solicitudes</button><div id="msg" style="margin-top:12px"></div></div><div id="orders"></div></main><script>const key=()=>document.getElementById('key').value;const msg=t=>document.getElementById('msg').textContent=t;async function loadOrders(){if(!key())return msg('Escribe la clave de administrador.');msg('Cargando...');try{const r=await fetch('/api/admin/premium-orders',{headers:{'X-Admin-Key':key()},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'No autorizado');const root=document.getElementById('orders');root.innerHTML=d.orders.length?d.orders.map(render).join(''):'<div class="box">No hay solicitudes.</div>';msg('Solicitudes cargadas.')}catch(e){msg(e.message)}}function render(o){const src=o.proofBase64?'data:'+o.proofMime+';base64,'+o.proofBase64:'';const status=o.status==='approved'?'<span class="tag ok">APROBADO</span>':o.status==='rejected'?'<span class="tag bad">RECHAZADO</span>':'<span class="tag">PENDIENTE</span>';return `<div class="box order"><div>${src?(o.proofMime==='application/pdf'?`<a href="${src}" target="_blank">📄 Ver PDF</a>`:`<img class="proof" src="${src}" alt="Comprobante">`):''}</div><div class="meta"><b>Solicitud:</b> ${o.id}<br><b>Nombre:</b> ${escapeHtml(o.customerName)}<br><b>Contacto:</b> ${escapeHtml(o.contact)}<br><b>Operación:</b> ${escapeHtml(o.yapeReference)}<br><b>Estado:</b> ${status}</div><div>${o.status==='pending'?`<button class="approve" onclick="act('${o.id}','approve')">✅ Aprobar</button><br><br><button class="danger" onclick="act('${o.id}','reject')">❌ Rechazar</button>`:'-'}</div></div>`}async function act(id,action){if(!confirm(action==='approve'?'¿Confirmas que el pago fue recibido en Yape?':'¿Rechazar esta solicitud?'))return;try{const r=await fetch('/api/admin/premium-orders/'+encodeURIComponent(id)+'/'+action,{method:'POST',headers:{'X-Admin-Key':key()}});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo completar');await loadOrders()}catch(e){alert(e.message)}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
